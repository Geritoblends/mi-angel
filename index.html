<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ni los ángeles son tan bonitos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#121316;
  --paper:#ffffff;
  --text:#ece7dd;
  --serif:"Cormorant Garamond","Cormorant",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--ink);-webkit-font-smoothing:antialiased}
html.light,html.light body{background:var(--paper)}

.intro{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  gap:clamp(1.4rem,5vw,5rem);padding:0 6vw;
  opacity:1;transition:opacity 1.4s ease;
}
.intro.out{opacity:0}
.angel{
  width:clamp(140px,34vw,440px);height:auto;flex:none;
  opacity:0;transition:opacity 1.8s ease;
  user-select:none;-webkit-user-drag:none;
}
.angel.in{opacity:1}
.line{
  font-family:var(--serif);font-style:italic;font-weight:400;
  font-size:clamp(1.4rem,3.5vw,3.3rem);line-height:1.18;letter-spacing:.005em;
  color:var(--text);text-align:left;max-width:11.5em;
}
.w{display:inline-block;white-space:nowrap}
.ch{position:relative;opacity:0}
.ch.on{opacity:1}
.ch.cur::after{
  content:"";position:absolute;left:100%;margin-left:.04em;top:14%;height:72%;width:1px;
  background:currentColor;animation:blink 1s steps(1) infinite;
}
@keyframes blink{50%{opacity:0}}

.collage{position:fixed;inset:0}
.collage img{
  position:absolute;display:block;opacity:0;
  transform-origin:50% 50%;will-change:transform,opacity;
  user-select:none;-webkit-user-drag:none;pointer-events:none;
}
</style>
</head>

  var TEXT = 'Ni los ángeles son tan bonitos';

  var rm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var sleep = function(ms){ return new Promise(function(r){ setTimeout(r, ms); }); };

  var intro = document.getElementById('intro');
  var angel = document.getElementById('angel');
  var line  = document.getElementById('line');
  var stage = document.getElementById('collage');

  /* ---------- typewriter markup (fixed layout, no reflow while typing) ---------- */
  var chars = [];
  TEXT.split(' ').forEach(function(word, wi, arr){
    var w = document.createElement('span'); w.className = 'w'; w.setAttribute('aria-hidden','true');
    word.split('').forEach(function(c){
      var s = document.createElement('span'); s.className = 'ch'; s.textContent = c;
      w.appendChild(s); chars.push(s);
    });
    line.appendChild(w);
    if (wi < arr.length - 1){ line.appendChild(document.createTextNode(' ')); chars.push(null); }
  });

  /* ---------- photos ---------- */
  var photos = PHOTOS.map(function(p, i){
    var el = new Image();
    el.src = p.src; el.alt = ''; el.draggable = false;
    el.style.zIndex = String(i + 1);
    stage.appendChild(el);
    return { el: el, ar: p.w / p.h, rect: null };
  });

  /* ---------- collage layout: picks the row arrangement that fills the screen best ---------- */
  function partitions(n, maxG, cb){
    var a = new Array(n).fill(0);
    (function rec(i, m){
      if (i === n){ cb(a, m); return; }
      for (var g = 0; g <= Math.min(m, maxG - 1); g++){ a[i] = g; rec(i + 1, Math.max(m, g + 1)); }
    })(0, 0);
  }

  function computeLayout(W, H){
    var u = Math.min(W, H), m = u * 0.05, gap = u * 0.014;
    var AW = W - 2*m, AH = H - 2*m, n = photos.length, best = null;

    partitions(n, 6, function(a, g){
      var rows = []; for (var k = 0; k < g; k++) rows.push([]);
      a.forEach(function(gi, i){ rows[gi].push(i); });
      var hs = [], sumH = 0;
      rows.forEach(function(r){
        var S = r.reduce(function(t, i){ return t + photos[i].ar; }, 0);
        var h = (AW - gap * (r.length - 1)) / S;
        hs.push(h); sumH += h;
      });
      var s = Math.min(1, (AH - gap * (g - 1)) / sumH);
      if (s <= 0) return;
      var minA = Infinity, A = 0;
      rows.forEach(function(r, k){
        var h = hs[k] * s;
        r.forEach(function(i){ var a2 = photos[i].ar * h * h; A += a2; if (a2 < minA) minA = a2; });
      });
      var sc = minA * Math.sqrt(A);
      if (!best || sc > best.sc) best = { sc: sc, rows: rows.map(function(r){ return r.slice(); }), hs: hs, s: s };
    });

    var rects = [], total = gap * (best.rows.length - 1);
    best.hs.forEach(function(h){ total += h * best.s; });
    var y = (H - total) / 2;
    best.rows.forEach(function(r, k){
      var h = best.hs[k] * best.s;
      var w = r.reduce(function(t, i){ return t + photos[i].ar * h; }, 0) + gap * (r.length - 1);
      var x = (W - w) / 2;
      r.forEach(function(i){
        var pw = photos[i].ar * h;
        rects[i] = { x: x, y: y, w: pw, h: h };
        x += pw + gap;
      });
      y += h + gap;
    });
    return rects;
  }

  function applyLayout(){
    var rects = computeLayout(window.innerWidth, window.innerHeight);
    photos.forEach(function(p, i){
      var r = rects[i]; p.rect = r;
      p.el.style.left = r.x + 'px'; p.el.style.top = r.y + 'px';
      p.el.style.width = r.w + 'px'; p.el.style.height = r.h + 'px';
    });
  }

  /* ---------- one photo: appears big at the centre, then travels and shrinks to its place ---------- */
  function fly(p){
    var W = window.innerWidth, H = window.innerHeight, r = p.rect;
    if (rm){
      p.el.animate([{opacity:0},{opacity:1}], { duration: 300, fill: 'both' });
      return;
    }
    var bigW = Math.min(W * 0.84, H * 0.8 * p.ar);
    var s0 = Math.max(1, bigW / r.w);
    var dx = W/2 - (r.x + r.w/2), dy = H/2 - (r.y + r.h/2);
    var start = 'translate(' + dx + 'px,' + dy + 'px) scale(' + s0 + ')';
    p.anim = p.el.animate([
      { opacity: 0, transform: start, offset: 0 },
      { opacity: 1, transform: start, offset: 0.02 },
      { opacity: 1, transform: start, offset: 0.14, easing: 'cubic-bezier(.65,0,.2,1)' },
      { opacity: 1, transform: 'translate(0px,0px) scale(1)', offset: 1 }
    ], { duration: 850, fill: 'both' });
  }

  /* ---------- timeline ---------- */
  var collageOn = false;

  async function run(){
    try { await Promise.race([document.fonts.ready, sleep(1800)]); } catch(e){}
    await Promise.all(photos.map(function(p){ return p.el.decode ? p.el.decode().catch(function(){}) : null; })
      .concat([angel.decode ? angel.decode().catch(function(){}) : null]));

    await sleep(300);

    /* 1 — angel on the left */
    angel.classList.add('in');
    await sleep(rm ? 400 : 1100);

    /* 2 — typewriter on the right */
    for (var i = 0; i < chars.length; i++){
      var c = chars[i];
      if (!c){ await sleep(rm ? 0 : 140); continue; }
      c.classList.add('on');
      var prev = line.querySelector('.cur'); if (prev) prev.classList.remove('cur');
      c.classList.add('cur');
      if (!rm) await sleep(62 + Math.random() * 58);
    }
    await sleep(rm ? 800 : 2300);

    /* 3 — both fade away */
    intro.classList.add('out');
    await sleep(rm ? 600 : 1500);
    await sleep(rm ? 100 : 450);

    /* 4 — flash: everything turns white at once */
    document.documentElement.classList.add('light');
    intro.style.display = 'none';

    /* 5 — photos, one by one */
    applyLayout();
    collageOn = true;
    await sleep(rm ? 100 : 160);
    for (var k = 0; k < photos.length; k++){
      fly(photos[k]);
      await sleep(rm ? 200 : 300);
    }
  }

  var rt;
  window.addEventListener('resize', function(){
    if (!collageOn) return;
    clearTimeout(rt);
    rt = setTimeout(function(){
      photos.forEach(function(p){ if (p.anim) { try { p.anim.finish(); } catch(e){} } });
      applyLayout();
    }, 120);
  });

  run();
})();
